---
- name: Install PostgreSQL packages
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
    update_cache: true 
  loop: "{{ postgres__packages }}"
  become: true

- name: Create /data directory
  ansible.builtin.file:
    path: /data
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create PostgreSQL directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'
  loop:
    - /data/postgres
    - "{{ postgres__data_dir }}"

- name: Disable automatic startup of default cluster
  ansible.builtin.lineinfile:
    path: "{{ __postgres_default_start_conf }}"
    regexp: '^auto$'
    line: manual

- name: Stop default PostgreSQL cluster
  ansible.builtin.systemd:
    name: "{{ __postgres_default_service }}"
    state: stopped
    enabled: false

- name: Initialize PostgreSQL cluster
  ansible.builtin.command:
    cmd: "{{ __postgres_bin_dir }}/pg_ctl initdb -D {{ postgres__data_dir }}"
    creates: "{{ postgres__data_dir }}/PG_VERSION"
  become_user: postgres

- name: Install PostgreSQL systemd service
  ansible.builtin.template:
    src: postgres-custom.service.j2
    dest: "{{ __postgres_service_unit }}"
    owner: root
    group: root
    mode: '0644'
  notify: Restart custom PostgreSQL

- name: Enable and start custom PostgreSQL
  ansible.builtin.systemd:
    name: "{{ __postgres_service }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Configure PostgreSQL options
  ansible.builtin.lineinfile:
    path: "{{ postgres__data_dir }}/postgresql.conf"
    regexp: "^#?\\s*{{ item.key }}\\s*="
    line: "{{ item.key }} = {{ item.value }}"
    owner: postgres
    group: postgres
  loop: "{{ postgres__opts | dict2items }}"
  notify: Restart custom PostgreSQL

- name: Configure PostgreSQL authentication
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "{{ postgres__data_dir }}/pg_hba.conf"
    owner: postgres 
    group: postgres
    mode: '0600'
  notify: Restart custom PostgreSQL

- name: Register obito
  community.postgresql.postgresql_user:
    name: "{{ item.name }}"
    password: "{{ item.password }}"
    role_attr_flags: LOGIN
    state: present
    login_unix_socket: /var/run/postgresql
  loop: "{{ postgres__users }}"
  become_user: postgres
  no_log: true

- name: Cerate PostgreSQL database
  community.postgresql.postgresql_db:
    name: "{{ item.name }}"
    owner: "{{ item.owner }}"
    state: present
    login_unix_socket: /var/run/postgresql
  loop: "{{ postgres__databases }}"
  become_user: postgres

- name: Apply PostgreSQL configuration before connection check
  ansible.builtin.meta: flush_handlers

- name: Check PostgreSQL connection with SELECT 1
  community.postgresql.postgresql_query:
    login_db: "{{ postgres__healthcheck_database }}"
    login_user: "{{ postgres__healthcheck_user }}"
    login_password: "{{ postgres__healthcheck_password }}"
    login_host: 127.0.0.1
    login_port: "{{ postgres__opts.port | default(5432) }}"
    query: SELECT 1
  changed_when: false
  no_log: true

- name: Create zetsu linux user
  ansible.builtin.user:
    name: "{{ postgres__exporter_user }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
    state: present

- name: Register zetsu in PostgreSQL
  community.postgresql.postgresql_user:
    name: "{{ postgres__exporter_user }}"
    state: present
    login_unix_socket: /var/run/postgresql
  become_user: postgres

- name: Grant Zetsu monitoring privileges
  community.postgresql.postgresql_membership:
    groups:
      - pg_monitor
    target_roles:
      - "{{ postgres__exporter_user }}"
    state: present
    login_unix_socket: /var/run/postgresql
  become_user: postgres

- name: Download PostgreSQL exporter
  ansible.builtin.get_url:
    url: "https://github.com/prometheus-community/postgres_exporter/releases/download/v{{ postgres__exporter_version }}/postgres_exporter-{{ postgres__exporter_version }}.{{ postgres__exporter_arch }}.tar.gz"
    dest: "{{ __postgres_exporter_archive }}"
    mode: '0644'
  delegate_to: localhost
  become: false

- name: Extract PostgreSQL exporter
  ansible.builtin.unarchive:
    src: "{{ __postgres_exporter_archive }}"
    dest: /tmp
    remote_src: true
    creates: "{{ __postgres_exporter_extract_dir }}/postgres_exporter"
  delegate_to: localhost
  become: false

- name: Install PostgreSQL exporter binary
  ansible.builtin.copy:
    src: "{{ __postgres_exporter_extract_dir }}/postgres_exporter"
    dest: "{{ __postgres_exporter_binary }}"
    owner: root
    group: root
    mode: '0755'
  notify: Restart PostgreSQL exporter

- name: Install PostgreSQL exporter service
  ansible.builtin.template:
    src: postgres-exporter.service.j2
    dest: "{{ __postgres_exporter_service_unit }}"
    mode: '0644'
  notify: Restart PostgreSQL exporter

- name: Start PostgreSQL exporter
  ansible.builtin.systemd:
    name: "{{ __postgres_exporter_service }}"
    enabled: true
    state: started
    daemon_reload: true  
